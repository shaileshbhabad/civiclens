<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Outer Shield / Circle Base -->
  <circle cx="32" cy="32" r="30" fill="#0f2b5c" stroke="#d97706" stroke-width="2.5" />
  <circle cx="32" cy="32" r="26" fill="none" stroke="#d97706" stroke-width="0.8" stroke-dasharray="2 1.5" opacity="0.6" />
  
  <!-- Central Emblem: Government Landmark / Assembly Dome & Pillars -->
  <!-- Triangular Pediment / Dome Top -->
  <path d="M 32 12 L 46 22 L 18 22 Z" fill="#d97706" />
  <!-- Dome Arc -->
  <path d="M 26 18 A 6 6 0 0 1 38 18" stroke="#ffffff" stroke-width="1.2" fill="none" />
  <circle cx="32" cy="11" r="1.8" fill="#fbbf24" />
  
  <!-- Entablature band -->
  <rect x="17" y="22" width="30" height="2.5" fill="#ffffff" rx="0.5" />
  
  <!-- 4 Pillars -->
  <rect x="20" y="26" width="3" height="15" fill="#ffffff" rx="0.5" />
  <rect x="26.5" y="26" width="3" height="15" fill="#ffffff" rx="0.5" />
  <rect x="34.5" y="26" width="3" height="15" fill="#ffffff" rx="0.5" />
  <rect x="41" y="26" width="3" height="15" fill="#ffffff" rx="0.5" />

  <!-- Base Steps -->
  <rect x="18" y="41" width="28" height="2" fill="#ffffff" rx="0.5" />
  <rect x="16" y="43" width="32" height="2.5" fill="#d97706" rx="0.5" />
  <rect x="14" y="45.5" width="36" height="3" fill="#ffffff" rx="0.5" />

  <!-- Laurel sprig accents / Civic Star -->
  <circle cx="32" cy="52" r="1.5" fill="#fbbf24" />
</svg>
